name: Build and Push Docker Image

# workflow_dispatch is here so a failed publish can be retried without an empty
# commit - this is the only workflow whose output is an artifact someone else
# consumes, so "just push again" is the expensive way to recover.
#
# The `paths` filter this trigger used to carry is deliberately gone. A push
# filter applies to tag pushes as well as branch pushes, so with `paths` in
# place, tagging a release on a commit that happened to touch only docs/ would
# match nothing and publish no image - a release that silently does not exist.
# Rebuilding main on a docs-only commit is the cheaper mistake, and the gha
# cache makes it nearly free.
on:
  workflow_dispatch: {}
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'

# Publishing is not cancel-in-progress: two pushes landing close together should
# both produce their sha tag rather than one silently losing its image.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: doom-organizer

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0

      # Evidence completeness is independent of scanner severity thresholds.
      # Missing review, unaccepted residual risk or failed checks block releases.
      - name: Verify release assessment
        if: github.ref_type == 'tag'
        run: python3 tools/security_assessment.py --release --publish

      - name: Read reviewed artifact identity
        id: reviewed
        if: github.ref_type == 'tag'
        run: |
          python3 - <<'PY'
          import json, os
          with open('docs/security/release-candidate.json') as source:
              candidate = json.load(source)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('ref=' + candidate['registry_ref'], file=output)
              print('image_id=' + candidate['image_id'], file=output)
          PY

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0

      # This step and the push below both used to be guarded on
      # `github.event_name == 'push'`, which has been the only trigger since the
      # workflow was written - a condition that cannot be false reads like a
      # dry-run mode exists when none does.
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A tag must not claim a version the code does not report. __version__ in
      # app/doom/__init__.py is what the container logs at startup; the git tag
      # is what people pull. If those two disagree, the image lies about itself
      # and no scanner would ever catch it. Checked before the build so a
      # mistyped tag costs seconds, not a published image.
      - name: Verify the tag matches __version__
        if: github.ref_type == 'tag'
        run: make verify-version TAG=${{ github.ref_name }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051  # v5.10.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          # latest=auto moves :latest onto a semver tag build, and only that.
          # It used to follow main, which meant `docker pull ...:latest` gave
          # you whatever landed on the default branch an hour ago. For a
          # self-hosted application that people deploy, :latest should mean the
          # newest deliberate release; main is still available as :main.
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha,prefix={{branch}}-,enable=${{ github.ref_type == 'branch' }}

      - name: Build and push Docker image
        if: github.ref_type != 'tag'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2
        with:
          context: ./app
          file: ./app/Dockerfile
          # The Dockerfile's last stage is `test`; never publish that one.
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A release promotes the exact reviewed artifact. Rebuilding after the
      # assessment could change apt packages, base layers or build tooling.
      - name: Promote reviewed release image
        if: github.ref_type == 'tag'
        env:
          VERIFIED_IMAGE: ${{ steps.reviewed.outputs.ref }}
          EXPECTED_IMAGE_ID: ${{ steps.reviewed.outputs.image_id }}
          RELEASE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          docker pull "$VERIFIED_IMAGE"
          actual=$(docker image inspect --format '{{.Id}}' "$VERIFIED_IMAGE")
          test "$actual" = "$EXPECTED_IMAGE_ID" || {
            echo 'Registry artifact differs from the reviewed image'; exit 1;
          }
          args=()
          while IFS= read -r image_tag; do
            test -z "$image_tag" || args+=(--tag "$image_tag")
          done <<< "$RELEASE_TAGS"
          test "${#args[@]}" -gt 0
          docker buildx imagetools create --prefer-index=false "${args[@]}" "$VERIFIED_IMAGE"
