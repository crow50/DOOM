name: Bandit Python Security Scanning 

# '**/app' matches a path component named "app", not the app/ subtree, so this
# scan did not reliably run on a change to application code.
on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
  pull_request:
    paths:
      - 'app/**'

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - name: Perform Bandit Analysis
        uses: PyCQA/bandit-action@v1