name: Bandit Python Security Scanning

# '**/app' matches a path component named "app", not the app/ subtree, so this
# scan did not reliably run on a change to application code. And main-only:
# see semgrep.yml for why every push now runs it.
on:
  push:
    paths:
      - 'app/**'
      - '.github/workflows/bandit-python-scanning.yml'
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/bandit-python-scanning.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with: { python-version: "3.12" }
      - run: pip install 'bandit[sarif]==1.9.4'

      # Run directly rather than through PyCQA/bandit-action: that action ends
      # its command with `|| true` and only uploads a SARIF file, so it can
      # never fail a build. The gate here is medium-or-higher severity at
      # medium-or-higher confidence, over the application package only - the
      # test suite's asserts are not a finding.
      - name: Bandit (gate)
        id: security_gate
        run: bandit -r app/doom -ll -ii

      # Full-severity SARIF for the Security tab, informational.
      - name: Bandit (report)
        if: always()
        run: bandit -r app/doom -f sarif -o bandit.sarif --exit-zero
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v4.39.1
        if: always()
        with:
          sarif_file: bandit.sarif
          category: bandit

      - name: Record scanner outcome
        if: always()
        env:
          SCAN_OUTCOME: ${{ steps.security_gate.outcome }}
        run: |
          echo "Scanner gate: $SCAN_OUTCOME. Skipped/failure is not a clean scan. Unfixed vulnerabilities remain reportable." >> "$GITHUB_STEP_SUMMARY"
