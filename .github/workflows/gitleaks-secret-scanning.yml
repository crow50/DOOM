name: Gitleaks Scan

# No pull_request branch filter: a PR targeting anything other than main used to
# skip the secret scan, which is the one check that should never be conditional
# on where a branch is headed.
on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # fetch-depth: 0 below means this walks the whole history, so read access to
    # contents is the whole requirement; the action summarises findings on the
    # pull request, which is the one write it needs.
    permissions:
      contents: read
      pull-requests: write
      security-events: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Bandit, Trivy, grype and CodeQL all report into the Security tab;
      # gitleaks was the one scanner whose findings lived only in a job log.
      # The hashFiles guard is deliberate: gitleaks writes results.sarif when it
      # has something to say, and an unconditional upload of a file that may not
      # exist would fail the job on a clean scan - turning the good outcome red.
      - name: Upload gitleaks results to the Security tab
        if: always() && hashFiles('results.sarif') != ''
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd  # v4.38.1
        with:
          sarif_file: results.sarif
          category: gitleaks
