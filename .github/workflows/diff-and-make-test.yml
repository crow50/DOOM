name: Lint, Compile, and Test
on: 
  push:
  pull_request:

jobs:
  lint-and-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install pip-tools
      - run: pip-compile --generate-hashes app/requirements.in -o /tmp/requirements-hashed.txt
      - run: diff /tmp/requirements-hashed.txt app/requirements.txt
      - run: make lint

  test:
    runs-on: ubuntu-latest
    env:
      PUBLIC_BASE_URL: http://localhost
    steps:
      - uses: actions/checkout@v6
      - run: make init
      - run: make test