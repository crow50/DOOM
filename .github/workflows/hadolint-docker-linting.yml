name: Hadolint Docker Linting

on:
  push:
    paths:
      - '**/Dockerfile'
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: app/Dockerfile