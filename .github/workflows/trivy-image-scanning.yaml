name: Trivy Container Scan

# 'Dockerfile' and '.dockerignore' used to be listed here as repository-root
# paths. Neither has lived at the root since the build context moved under app/,
# so both filters named a file that cannot change - and the files that replaced
# them, app/Dockerfile and app/.dockerignore, are already covered by 'app/**'.
#
# The pull_request branch filter is gone for the reason recorded in
# sbom-scanning.yml: a pull request targeting anything other than main skipped
# the image scan entirely.
# The weekly run is the point of the schedule, not a belt-and-braces extra: a
# CVE published against a package already in the image turns this red with
# nothing in the diff to explain it (see PIPELINE-NOTES.md). Without a cron,
# that is only discovered when somebody happens to touch app/**, which on a
# finished image can be never.
#
# 'clamav/**' was missing here too, same gap and same fix as sbom-scanning.yml:
# neither this workflow nor that one had ever built or scanned clamav's image,
# so a change under clamav/ triggered no image scan at all, on any schedule.
on:
  schedule:
    - cron: '0 6 * * 1'  # Mondays 06:00 UTC
  push:
    paths:
      - 'app/**'
      - 'caddy/**'
      - 'clamav/**'
      - 'db/**'
      - '.github/workflows/trivy-image-scanning.yaml'
  pull_request:
    paths:
      - 'app/**'
      - 'caddy/**'
      - 'clamav/**'
      - 'db/**'
      - '.github/workflows/trivy-image-scanning.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trivy-scan:
    runs-on: ubuntu-latest
    # A build plus two scans; the default six-hour ceiling is not a timeout.
    timeout-minutes: 20

    # Set permissions for the job to allow uploading SARIF reports
    permissions:
      contents: read
      security-events: write
      actions: read
      issues: write

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0

        # Building the Docker images to be scanned
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0

      - name: Build app image
        run: docker build -f app/Dockerfile --target runtime -t doom-organizer-app:${{ github.sha }} ./app

      - name: Build clamav image
        run: docker build -f clamav/Dockerfile -t doom-organizer-clamav:${{ github.sha }} ./clamav

      # Store the exact image config digest and platform next to the scan
      # workflow run so the tag does not stand in for artifact identity.
      - name: Record candidate image identities
        run: |
          docker image inspect doom-organizer-app:${{ github.sha }} > candidate-image-inspect-app.json
          docker image inspect doom-organizer-clamav:${{ github.sha }} > candidate-image-inspect-clamav.json

      - name: Upload candidate app image identity
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: doom-organizer-app-image-${{ github.sha }}
          path: candidate-image-inspect-app.json
          if-no-files-found: error

      - name: Upload candidate clamav image identity
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: doom-organizer-clamav-image-${{ github.sha }}
          path: candidate-image-inspect-clamav.json
          if-no-files-found: error

      - name: Generate app-image SBOM for exact-PURL VEX
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26  # v0.24.2
        with:
          image: doom-organizer-app:${{ github.sha }}
          format: cyclonedx-json
          output-file: sbom-app.cyclonedx.json
          upload-artifact: false

      # The package inventory remains at Alpine zlib 1.3.2-r0, but the app
      # image ships the verified upstream-patched library. The generated
      # statement is bound to the exact PURL from this image's SBOM and fails
      # closed on any distro/version change. clamav's image carries no such
      # patch, so it is scanned with no VEX at all - its own trivy-config
      # below is omitted, not pointed at the app image's statement.
      - name: Generate exact-PURL VEX for patched app-image zlib
        run: python3 tools/generate_runtime_vex.py sbom-app.cyclonedx.json --output runtime-zlib.vex.json

      - name: Configure Trivy to consume the exact-PURL VEX
        run: |
          cat > trivy-vex.yaml <<'EOF'
          vulnerability:
            vex:
              - ./runtime-zlib.vex.json
          EOF

        # Scanning both images with Trivy. continue-on-error on both gate
        # steps is deliberate: without it, the app image's step failing on a
        # CRITICAL/HIGH finding would skip the clamav build and scan entirely -
        # the "Fail if either image's scan gated" step below is what actually
        # fails the job (and this workflow's checks) on either image's finding.
      - name: Run Trivy scan on app image
        id: security_gate_app
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: doom-organizer-app:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: 'false'
          severity: 'CRITICAL,HIGH'
          trivy-config: trivy-vex.yaml

      - name: Run Trivy scan on clamav image
        id: security_gate_clamav
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: doom-organizer-clamav:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: 'false'
          severity: 'CRITICAL,HIGH'

        # Generating SARIF reports with Trivy, every severity, for the
        # Security tab - independent of the gate steps' outcome above.
      - name: Run Trivy and generate SARIF report for app image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        if: always()
        with:
          image-ref: doom-organizer-app:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-app-results.sarif'
          severity: 'UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL'
          ignore-unfixed: 'false'
          exit-code: '0'
          skip-setup-trivy: 'true' # Reuse Trivy binary from the action's cache to speed up setup
          trivy-config: trivy-vex.yaml

      - name: Run Trivy and generate SARIF report for clamav image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        if: always()
        with:
          image-ref: doom-organizer-clamav:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-clamav-results.sarif'
          severity: 'UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL'
          ignore-unfixed: 'false'
          exit-code: '0'
          skip-setup-trivy: 'true'

        # Uploading SARIF reports to GitHub Security tab
      - name: Upload app Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd  # v4.38.1
        if: always()
        with:
          sarif_file: 'trivy-app-results.sarif'
          category: 'trivy-container-scan-app'

      - name: Upload clamav Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd  # v4.38.1
        if: always()
        with:
          sarif_file: 'trivy-clamav-results.sarif'
          category: 'trivy-container-scan-clamav'

      - name: Fail if either image's scan gated
        if: always()
        run: |
          echo "app scan: ${{ steps.security_gate_app.outcome }}"
          echo "clamav scan: ${{ steps.security_gate_clamav.outcome }}"
          if [ "${{ steps.security_gate_app.outcome }}" != "success" ] || [ "${{ steps.security_gate_clamav.outcome }}" != "success" ]; then
            echo "At least one image has a CRITICAL/HIGH finding (or failed to scan)." >&2
            exit 1
          fi

      # Only on the scheduled run. On a push or a pull request the red check is
      # already the notification and the author is already looking at it; a cron
      # failure at 06:00 Monday, against code nobody touched, notifies nobody.
      # update-existing keeps this to one open issue rather than a weekly pile.
      - name: Open an issue if the scheduled scan failed
        if: failure() && github.event_name == 'schedule'
        uses: JasonEtco/create-an-issue@1b14a70e4d8dc185e5cc76d3bec9eab20257b2c5  # v2.9.2
        with:
          # Relative to .github/workflows/, not to the repository root - this
          # action resolves the path from the workflow directory. Templates one
          # level up in .github/ISSUE_TEMPLATE/ are not found.
          filename: .github/workflows/ISSUE_TEMPLATE/ci-trivy-scan.md
          update-existing: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Record scanner outcome
        if: always()
        env:
          APP_OUTCOME: ${{ steps.security_gate_app.outcome }}
          CLAMAV_OUTCOME: ${{ steps.security_gate_clamav.outcome }}
        run: |
          echo "Scanner gate - app: $APP_OUTCOME, clamav: $CLAMAV_OUTCOME. Skipped/failure is not a clean scan. Unfixed vulnerabilities remain reportable." >> "$GITHUB_STEP_SUMMARY"
