# clamd, scoped to exactly what this deployment needs.
#
# TCP rather than the local unix socket: `web` and `clamav` are separate
# containers, and TCP on the internal, no-route-off-host network is the same
# trust model docker-compose.yml already uses for db and cache. The local
# socket stays enabled too, for the same-container healthcheck.
TCPSocket 3310
TCPAddr 0.0.0.0
LocalSocket /run/clamav/clamd.sock
PidFile /run/clamav/clamd.pid
DatabaseDirectory /var/lib/clamav
TemporaryDirectory /tmp

LogTime yes
Foreground yes
User clamav

MaxThreads 4
ReadTimeout 30
