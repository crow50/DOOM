name: doom

services:
  # ---------------------------------------------------------------------------
  # caddy - TLS termination.  The ONLY service that publishes a port.
  #
  # Not optional: Web NFC requires a secure context, and a phone reaching this
  # host over a LAN IP is not one.  TLS is a functional requirement here.
  # ---------------------------------------------------------------------------
  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      DOOM_DOMAIN: ${DOOM_DOMAIN:-localhost}
      # The plaintext listener redirects to https://host:HTTPS_PORT.  Caddy's
      # automatic redirect targets the bare site address, which on the
      # unprivileged default ports sent visitors to :443 where nothing
      # listens.
      HTTPS_PORT: ${HTTPS_PORT:-443}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Optional operator TLS settings - an ACME contact address, or the
      # staging CA while a first certificate is being sorted out. Empty by
      # default, and the Caddyfile imports it with a glob, so empty is not an
      # error. This replaces an ACME_EMAIL environment variable that compose
      # passed in and the Caddyfile never read.
      - ./caddy/conf.d:/etc/caddy/conf.d:ro
      # Certificates this deployment did not issue. Empty by default; a
      # homelab that already runs a certificate manager mounts its wildcard
      # here, or replaces this line with the volume that manager writes to.
      - ./caddy/certs:/etc/caddy/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    networks:
      # edge for inbound traffic from the LAN, proxy to reach the application.
      # Caddy is the only service on both, which is what makes `web` reachable
      # without giving `web` a route back out.
      - edge
      - proxy
    # --- container hardening (T-34) ---
    # The same posture as `web`, and it matters more here: this is the one
    # process that parses bytes straight off the network.  Until an audit
    # checked, it ran as root with Docker's full default capability set on a
    # writable filesystem - the strongest starting position in the stack, on
    # the most exposed process.
    #
    # The image chmods /data/caddy and /config/caddy to 1777, so a non-root
    # Caddy can still write its internal CA and autosaved config into the
    # named volumes.  A caddy_data volume created by an OLDER root Caddy has
    # root-owned 0700 directories inside it; wipe it once (`make clean`, or
    # `docker volume rm doom_caddy_data`) and let this one recreate the CA.
    #
    # cap_drop ALL, then exactly one back.  The image setcaps the caddy binary
    # with cap_net_bind_service=+ep, and the kernel refuses to exec a file
    # whose capabilities lie outside the bounding set ("operation not
    # permitted" on every restart), so it cannot be dropped entirely.  It is
    # also the one capability a port-80/443 listener legitimately needs.
    # Verify: CapEff in /proc/1/status is 0000000000000400 - bit 10, that
    # capability, and nothing else.
    user: "10002:10002"
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true

  # ---------------------------------------------------------------------------
  # web - the application.  Reachable only through caddy.
  # ---------------------------------------------------------------------------
  web:
    build:
      context: ./app
      # Named, because the Dockerfile's last stage is `test` and an unnamed
      # build would ship the test suite.
      target: runtime
    restart: unless-stopped
    # ASVS 6.4.1 — secrets arrive as read-only files, not environment
    # variables. An env var is inherited by every child process, shows up in
    # `docker inspect`, and can be read straight out of /proc/<pid>/environ.
    # A mounted file has none of those properties.
    #
    # This is also the shape a real vault expects (Docker secrets, Kubernetes
    # and Vault agent all present secrets as files), so moving to one later is
    # a mount change rather than a code change.
    secrets:
      - doom_secret_key
      - doom_app_db_password
      - doom_redis_password
    environment:
      SECRET_KEY_FILE: /run/secrets/doom_secret_key
      # The app gets the RESTRICTED role.  It never holds admin credentials,
      # so a successful injection still cannot ALTER or DROP anything (T-35).
      # Assembled by the entrypoint from the mounted secret files, so no
      # password reaches the process environment.
      APP_DB_USER: ${APP_DB_USER:-doom_app}
      APP_DB_PASSWORD_FILE: /run/secrets/doom_app_db_password
      POSTGRES_DB: ${POSTGRES_DB:-doom}
      REDIS_PASSWORD_FILE: /run/secrets/doom_redis_password
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?PUBLIC_BASE_URL is required - labels bake it in permanently}
      UPLOAD_DIR: /var/lib/doom/uploads
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      GUNICORN_THREADS: ${GUNICORN_THREADS:-4}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      # Writable island in an otherwise read-only filesystem.
      - uploads:/var/lib/doom/uploads:rw
    networks:
      # NOT `edge`. The application has no route off this host at all: it can
      # reach the database and the cache on `internal`, and Caddy can reach it
      # on `proxy`, and that is the entire set of destinations that exist for
      # it. This is the server-level outbound allowlist ASVS 5.0.0-13.2.4 and
      # 13.2.5 ask for, expressed as a deny-all, which is the only version of
      # an allowlist that cannot be incomplete.
      #
      # It also means an SSRF in the application has nowhere to go. That is
      # worth more than the validation in security/lookup.py, because it holds
      # even when the validation is wrong.
      #
      # Enabling BARCODE_LOOKUP_PROVIDER needs outbound HTTPS and therefore
      # needs `edge` added back here. That is a deliberate, reviewable change
      # rather than the default posture - see docs/security/POLICIES.md §9.
      - proxy
      - internal
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
      # Not condition: service_healthy - clamd's first boot downloads a
      # multi-million-signature database and can take minutes, and gating
      # the whole application on that would make one slow dependency block
      # every route, not just uploads. Uploads themselves fail closed
      # (app/doom/security/av.py) if clamd is not answering yet, which is
      # the behaviour that actually matters here.
      clamav:
        condition: service_started
    # --- container hardening (T-34) ---
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Argon2id reserves 64 MiB per hash in flight.  workers x threads x 64 MiB
    # must fit here with headroom, or concurrent logins OOM the container (T-30).
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ---------------------------------------------------------------------------
  # test - the `test` build stage: runtime image plus the suite and pytest.
  # Behind a profile so `make up` and `make build` never touch it; `make test`
  # names it explicitly.  Runs against the separate doom_test database as the
  # ADMIN role (the suite needs CREATE for db.create_all()), never against the
  # real one, and holds no secret files - the tests set their own SECRET_KEY.
  # ---------------------------------------------------------------------------
  test:
    profiles: ["test"]
    build:
      context: ./app
      target: test
    image: doom-web-test
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_ADMIN_USER:-doom_admin}:${POSTGRES_PASSWORD}@db:5432/doom_test
      REDIS_URL: redis://:${REDIS_PASSWORD}@cache:6379/9
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://test.invalid}
    networks:
      - internal
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
      # Here, unlike `web`, health-gated: TestAntivirusScanning asserts a
      # specific clean/FOUND/unavailable outcome, and a scanner that is only
      # half up would make those tests flaky rather than honest.
      clamav:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      # The suite exercises uploads.  Before this service existed, `make test`
      # ran inside `web` and wrote its fixtures into the REAL uploads volume;
      # an ephemeral tmpfs is the right place for them.
      - /var/lib/doom/uploads:size=64m,uid=10001,gid=10001
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # ---------------------------------------------------------------------------
  # db - postgres.  No published port; internal network only.
  # ---------------------------------------------------------------------------
  db:
    image: postgres:18.6-alpine
    restart: unless-stopped
    secrets:
      - doom_postgres_password
      - doom_app_db_password
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-doom}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-doom_admin}
      # The official image supports _FILE for POSTGRES_PASSWORD, POSTGRES_USER,
      # POSTGRES_DB and POSTGRES_INITDB_ARGS.  Those four, and no others - there
      # is no generic *_FILE handling.
      POSTGRES_PASSWORD_FILE: /run/secrets/doom_postgres_password
      APP_DB_USER: ${APP_DB_USER:-doom_app}
      # Which is why this one is read by db/init/01-roles.sh itself.  It was not,
      # once, and the application role was silently never created.
      APP_DB_PASSWORD_FILE: /run/secrets/doom_app_db_password
    volumes:
      - pgdata:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    # -h 127.0.0.1 is load-bearing.  Without a host, pg_isready checks the unix
    # socket - which the *temporary* server started during initialisation also
    # answers on, since that one runs with listen_addresses=''.  So a database
    # whose init scripts were still running, or had just failed, reported healthy,
    # `web` was released to start against it, and a failed bootstrap looked like a
    # successful one.  Over TCP the check can only pass once the real server is up,
    # which is the only thing `web` can use anyway.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_ADMIN_USER:-doom_admin} -d ${POSTGRES_DB:-doom}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # cache - redis, backing the rate limiter.
  #
  # Password-protected even though it sits on an internal-only network:
  # defence in depth costs one flag here.
  # ---------------------------------------------------------------------------
  cache:
    image: redis:8.10.1-alpine
    restart: unless-stopped
    # requirepass lives in a mounted config file, not on the command line.
    # A command-line password is visible to anything that can read `ps` inside
    # the container, and to `docker inspect` outside it (ASVS 6.4.1).
    command: ["redis-server", "/etc/redis/redis.conf"]
    volumes:
      - ./secrets/redis.conf:/etc/redis/redis.conf:ro
    # Start as the unprivileged redis user directly.  The stock entrypoint
    # boots as root and drops privileges with setpriv, which needs CAP_SETUID
    # and CAP_SETGID - impossible under cap_drop: ALL.  Starting unprivileged
    # skips that step entirely, so we keep zero capabilities AND a non-root
    # process instead of trading one for the other.
    user: "redis"
    networks:
      - internal
    read_only: true
    tmpfs:
      # Persistence is off (--save "" --appendonly no); rate-limit counters are
      # ephemeral by nature and rebuilding them after a restart is correct.
      - /data:size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # Reads the password from the same config file rather than repeating it
      # on a command line the process table would show.
      test: ["CMD-SHELL", "redis-cli -a \"$$(grep -m1 '^requirepass' /etc/redis/redis.conf | cut -d' ' -f2)\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # clamav - scans uploads before they are stored (ASVS 5.0.0-5.4.3).
  #
  # No authentication on the socket to `web`: clamd's wire protocol has none
  # to offer, and `internal` - no route off the host - is the same trust
  # model docker-compose.yml already gives db and cache for that side.
  #
  # Unlike db and cache, this container also needs a real route out: signature
  # updates come from database.clamav.net, and a scanner running forever on
  # the day-one database is not meaningfully scanning. `clamav_updates` is a
  # second, narrow exception to the no-egress-by-default posture - the same
  # shape as BARCODE_LOOKUP_PROVIDER's use of `edge` (docs/security/POLICIES.md
  # §9), scoped to this one container and this one destination class rather
  # than opened stack-wide.
  # ---------------------------------------------------------------------------
  clamav:
    build:
      context: ./clamav
    restart: unless-stopped
    volumes:
      # Signature updates persist across restarts. Without this, every
      # restart re-downloads the full database instead of an incremental one.
      - clamav_db:/var/lib/clamav
    networks:
      - internal
      - clamav_updates
    user: "clamav"
    read_only: true
    tmpfs:
      - /run/clamav:mode=1777,size=8m
      - /tmp:mode=1777,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # Same-container ping over the local socket - cheaper than a network
      # round trip and exercises the same "is the engine actually loaded"
      # question a TCP scan would.
      test: ["CMD", "clamdscan", "--ping", "1"]
      interval: 15s
      timeout: 10s
      retries: 20
      # A cold engine loading several million signatures on constrained
      # hardware (this fleet includes Raspberry Pi) has taken several minutes
      # in testing. A short start_period would flap the container into
      # "unhealthy" while it is still doing legitimate first-boot work.
      start_period: 300s

networks:
  edge:
    driver: bridge
  proxy:
    # Caddy to the application, and nothing else. `internal: true` means no
    # route off the host, so being on this network gives the application
    # reachability without giving it egress.
    internal: true
  internal:
    # No route off the host.  db and cache cannot be reached from the LAN even
    # if a port were published by mistake.
    internal: true
  clamav_updates:
    # A real route out, unlike every other network here - clamd's only
    # destination on it is database.clamav.net for signature updates. Nothing
    # but the clamav service is ever placed on this network; no port is
    # published from it either, so it grants egress without granting LAN
    # reachability.
    driver: bridge

secrets:
  doom_secret_key:
    file: ./secrets/secret_key
  doom_postgres_password:
    file: ./secrets/postgres_password
  doom_app_db_password:
    file: ./secrets/app_db_password
  doom_redis_password:
    file: ./secrets/redis_password

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
  clamav_db:
